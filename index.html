<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etichette 58 mm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<style>
:root{--paper:#f4f1ea;--ink:#111;--mute:#6b675e;--line:#cfc9bb;--acc:#e8392b}
@media(prefers-color-scheme:dark){:root{--paper:#17160f;--ink:#f1ede2;--mute:#9a958a;--line:#37342a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font:800 34px/1 Arial Black,Arial,sans-serif;letter-spacing:-1px;margin:28px 0 6px;text-transform:uppercase}
h1 span{color:var(--acc)}
p.s{color:var(--mute);margin:0 0 22px;font-size:14px}
.drop{display:block;border:2px dashed var(--ink);padding:30px 16px;text-align:center;cursor:pointer;font-weight:700}
.drop input{display:none}
.drop small{display:block;font-weight:400;color:var(--mute);margin-top:6px}
.opt{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:14px;color:var(--mute)}
select{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);padding:4px 6px}
.item{border-top:2px solid var(--ink);padding:14px 0}
.item h2{font-size:15px;margin:0 0 8px;word-break:break-all}
.prev{display:flex;gap:8px;height:120px;overflow:hidden;margin-bottom:10px}
.prev img{height:100%;border:1px solid var(--line);background:#fff;image-rendering:pixelated}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,a.b{font-weight:700;font-size:14px;font-family:inherit;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 14px;text-decoration:none;cursor:pointer}
button.g,a.g{background:transparent;color:var(--ink)}
.err{color:var(--acc)}
#st{color:var(--mute);font-size:14px;min-height:22px;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Etichette<br><span>58 mm</span></h1>
<p class="s">Converte i PDF InPost in due strisce per stampante termica: barcode + DataMatrix, e dati in lungo. Tutto resta sul telefono, funziona anche offline.</p>
<label class="drop"><input id="f" type="file" accept="application/pdf" multiple>Scegli uno o più PDF<small>oppure condividili qui da un'altra app</small></label>
<div class="opt">Formato: <select id="fmt"><option value="jpg">2 immagini JPG</option><option value="pdf">PDF (2 pagine)</option></select></div>
<div class="opt">Spessore barre: <select id="mod"><option value="4">4 (normale)</option><option value="5">5 (più grande)</option><option value="6">6 (enorme)</option></select></div>
<div id="st"></div>
<div id="out"></div>
<div class="item" id="all" hidden><div class="btns"><button id="dall">Scarica tutti i file</button></div></div>
</main>
<script src="pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
